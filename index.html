<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <script>
      // רענון אוטומטי חד-פעמי אם קובץ (script/link) נכשל בטעינה — בד"כ HTML ישן
      // בזיכרון/מטמון (אפליקציה מותקנת שנשארה פתוחה/ברקע) שמצביע על asset עם hash
      // שכבר לא קיים אחרי דיפלוי חדש. שגיאות טעינת משאבים לא "מבעבעות" רגיל,
      // לכן חובה capture=true ברמת ה-window. בלי זה — מסך לבן שקט לגמרי, כי זה
      // קורה לפני שריאקט (וה-ErrorBoundary) בכלל עולים. sessionStorage מונע לולאה.
      // *חייב* לשבת ראשון ב-<head> — Vite מזיז את תג ה-module script/stylesheet
      // הראשי ל-<head> בבנייה, ואם הליסנר הזה נרשם אחריהם (למשל בסוף ה-body)
      // הוא עלול לפספס כשל טעינה שכבר קרה עד אז.
      (function () {
        var KEY = 'tp-stale-asset-reload'
        window.addEventListener('error', function (e) {
          var t = e.target
          if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK') && !sessionStorage.getItem(KEY)) {
            sessionStorage.setItem(KEY, '1')
            window.location.reload()
          }
        }, true)
      })()
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>TeamPact</title>
    <meta name="description" content="TeamPact — אקדמיית אומנויות לחימה: MMA, ג'יו-ג'יטסו ואיגרוף תאילנדי. הרשמה למנוי, אימוני ניסיון וניהול מתאמנים." />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#f9fafb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TeamPact" />
    <style>
      html, body { margin: 0; height: 100%; background: #f9fafb; }
      /* #root ממלא את כל המסך עוד לפני ש-React מצייר — מונע "פלאש" של רקע body
         בשבריר השנייה שבין טעינת ה-PWA לבין ה-render הראשון של React. */
      #root { min-height: 100%; background: #f9fafb; }
      /* מבטל פינץ'-זום ודאבל-טאפ-זום במובייל — הנגישות של המערכת עדיין עובדת */
      html { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
      body { touch-action: manipulation; overscroll-behavior: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
